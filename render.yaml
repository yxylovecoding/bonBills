services:
  - type: web
    name: bonbills
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build:deploy
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
