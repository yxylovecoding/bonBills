name: Hourly TickTick replanning

on:
  schedule:
    # Every hour at :07, away from the top-of-hour visibility/full-sync jobs.
    - cron: '7 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ticktick-daily-planning
  cancel-in-progress: false

jobs:
  replan:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Replan remaining ordinary tasks
        env:
          CRON_SECRET: ${{ secrets.BONBILLS_CRON_SECRET }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const secret = process.env.CRON_SECRET?.trim();
          if (!secret) throw new Error('Missing BONBILLS_CRON_SECRET');
          let busyAttempts = 0;
          let retryAttempts = 0;
          const retryStages = new Set(['outlook-refresh', 'tasks-read', 'completion-history', 'template-read']);
          const failureStages = new Set([...retryStages, 'timed-visibility', 'planning']);
          for (;;) {
            const response = await fetch('https://www.bonbills.cn/api/ticktick-trips?action=hourly-replan', {
              headers: { Authorization: `Bearer ${secret}` }, redirect: 'error', signal: AbortSignal.timeout(320_000),
            }).catch(() => { throw new Error('Hourly replanning request failed or timed out'); });
            const result = await response.json().catch(() => null);
            if (response.status === 202 && busyAttempts++ < 2) {
              await new Promise(resolve => setTimeout(resolve, 30_000));
              continue;
            }
            const stage = failureStages.has(result?.failure?.stage) ? result.failure.stage : 'unknown';
            // Retry only confirmed read failures. A timeout or failed write may
            // have already changed tasks upstream, so do not replay it blindly.
            if (response.status === 502 && result?.failure?.retryable === true
                && retryStages.has(stage) && retryAttempts < 2) {
              const delay = 30_000 * ++retryAttempts;
              console.log(`Hourly replanning retry ${retryAttempts}/2: HTTP 502, stage=${stage}.`);
              await new Promise(resolve => setTimeout(resolve, delay));
              continue;
            }
            const skipped = ['sleep-window', 'restore-pending', 'disconnected'].includes(result?.skipped);
            if (response.status !== 200 || result?.ok !== true || result.busy || result.error
                || (!skipped && !result.dailyPlan)) {
              throw new Error(`Hourly replanning did not complete (HTTP ${response.status}, stage=${stage})`);
            }
            // No task titles, dates, credentials or provider responses in public logs.
            console.log(skipped ? 'Hourly replanning deferred by current connection/visibility state.'
              : 'Hourly replanning completed successfully.');
            process.exit(0);
          }
          NODE
