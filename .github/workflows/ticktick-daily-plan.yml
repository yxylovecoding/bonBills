name: Daily calendar sync and planning

on:
  schedule:
    # Asia/Shanghai: 07:01, 12:00, 17:00, 20:00. GitHub cron uses UTC.
    - cron: '1 23 * * *'
    - cron: '0 4,9 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      periods_only:
        description: Only import and archive Outlook periods
        type: boolean
        default: false
      send_email:
        description: Send today's briefing after planning (deduplicated by date)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ticktick-daily-planning
  cancel-in-progress: false

jobs:
  hair-wash:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '0 12 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Show hair washing and reading at 20:00
        env:
          CRON_SECRET: ${{ secrets.BONBILLS_CRON_SECRET }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const secret = process.env.CRON_SECRET?.trim();
          if (!secret) throw new Error('Missing BONBILLS_CRON_SECRET');
          for (let attempt = 0; attempt < 3; attempt++) {
            const response = await fetch('https://www.bonbills.cn/api/ticktick-trips?action=hair-wash', {
              headers: { Authorization: `Bearer ${secret}` }, redirect: 'error', signal: AbortSignal.timeout(90_000),
            }).catch(() => { throw new Error('Hair-wash visibility request failed'); });
            if (response.status === 202 && attempt < 2) {
              await response.body?.cancel();
              await new Promise(resolve => setTimeout(resolve, 30_000));
              continue;
            }
            const result = await response.json().catch(() => null);
            if (response.status === 200 && result?.ok === true && result.skipped === 'rest-window') {
              console.log('Automatic work paused for the rest window.'); process.exit(0);
            }
            if (response.status !== 200 || result?.ok !== true || result.busy || result.error
                || (result.connected !== false && (!result.hairWash || !result.reading))) {
              throw new Error(`Hair-wash visibility did not complete (HTTP ${response.status})`);
            }
            console.log('Hair-wash visibility updated successfully.');
            process.exit(0);
          }
          NODE
  archive-periods:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      completed: ${{ steps.archive.outputs.completed }}
      restored: ${{ steps.restore.outputs.completed }}
    steps:
      - name: Restore morning visibility before planning
        id: restore
        if: ${{ github.event.schedule == '1 23 * * *' }}
        env:
          CRON_SECRET: ${{ secrets.BONBILLS_CRON_SECRET }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const secret = process.env.CRON_SECRET?.trim();
          if (!secret) throw new Error('Missing BONBILLS_CRON_SECRET');
          const scope = 'all', action = 'routine-visibility';
          let busyAttempts = 0;
          for (let batch = 0; batch < 40; batch++) {
            let response;
            try {
              response = await fetch(`https://www.bonbills.cn/api/ticktick-trips?action=${action}`, {
                headers: { Authorization: `Bearer ${secret}` },
                redirect: 'error',
                signal: AbortSignal.timeout(150_000),
              });
            } catch {
              throw new Error('Routine visibility request failed or timed out');
            }
            if (response.status === 202 && busyAttempts++ < 2) {
              await response.body?.cancel();
              await new Promise(resolve => setTimeout(resolve, 30_000));
              continue;
            }
            const result = await response.json().catch(() => null);
            if (response.status === 200 && result?.ok === true && result.skipped === 'rest-window') {
              console.log('Automatic work paused for the rest window.'); process.exit(0);
            }
            if (response.status === 200 && result?.ok === true && !result.busy && !result.error
                && result.sleepTags?.complete === false) continue;
            if (response.status !== 200 || result?.ok !== true || result.busy || result.error
                || (result.connected !== false && ((scope !== 'daily' && (!result.nightRoutine || !result.exercise))
                  || (scope !== 'night' && result.sleepTags?.complete !== true)))) {
              throw new Error(`Routine visibility sync did not complete (HTTP ${response.status})`);
            }
            // Public logs contain no credentials, task titles, tags or dates.
            appendFileSync(process.env.GITHUB_OUTPUT, 'completed=true\n');
            console.log('Scheduled routine visibility sync completed successfully.');
            process.exit(0);
          }
          throw new Error('Routine visibility still has pending batches');
          NODE
      - name: Import and save Outlook periods
        id: archive
        if: ${{ github.event.schedule != '1 23 * * *' || steps.restore.outputs.completed == 'true' }}
        env:
          CRON_SECRET: ${{ secrets.BONBILLS_CRON_SECRET }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const secret = process.env.CRON_SECRET?.trim();
          if (!secret) throw new Error('Missing BONBILLS_CRON_SECRET');
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              const response = await fetch('https://www.bonbills.cn/api/ticktick-trips?action=life-periods', {
                headers: { Authorization: `Bearer ${secret}` },
                redirect: 'error',
                signal: AbortSignal.timeout(80_000),
              });
              const result = await response.json().catch(() => null);
              if (response.status === 200 && result?.ok === true && result.skipped === 'rest-window') {
                console.log('Automatic work paused for the rest window.'); process.exit(0);
              }
              if (response.status === 200 && result?.ok === true
                && (result.connected === false || (result.connected === true && typeof result.syncedAt === 'string'))) {
                appendFileSync(process.env.GITHUB_OUTPUT, 'completed=true\n');
                console.log(result.connected ? 'Outlook periods archived successfully.' : 'Period calendar is not connected.');
                process.exit(0);
              }
              if (response.status === 401 || response.status === 403) break;
            } catch { /* Keep subscription URLs, provider bodies and health data out of logs. */ }
            if (attempt < 2) await new Promise(resolve => setTimeout(resolve, 10_000));
          }
          throw new Error('Period calendar import did not complete; saved history is retained.');
          NODE
  recalculate:
    needs: [archive-periods, hair-wash]
    if: ${{ always() && inputs.periods_only != true && (github.event.schedule != '1 23 * * *' || needs.archive-periods.outputs.restored == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      completed: ${{ steps.plan.outputs.completed }}
    steps:
      - name: Refresh Outlook and recalculate TickTick
        id: plan
        env:
          CRON_SECRET: ${{ secrets.BONBILLS_CRON_SECRET }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const secret = process.env.CRON_SECRET?.trim();
          if (!secret) throw new Error('Missing BONBILLS_CRON_SECRET');
          let busyAttempts = 0;
          let retryAttempts = 0;
          const retryStages = new Set(['completion-archive', 'outlook-refresh', 'tasks-read', 'completion-history', 'template-read']);
          const failureStages = new Set([...retryStages, 'planning', 'finalize']);
          for (let batch = 0; batch < 40; batch++) {
            let response;
            try {
              response = await fetch('https://www.bonbills.cn/api/ticktick-trips', {
                headers: { Authorization: `Bearer ${secret}` },
                redirect: 'error',
                signal: AbortSignal.timeout(320_000),
              });
            } catch {
              // Never log the secret, provider error body or private task data.
              // Without a response, an upstream task creation may already have succeeded.
              throw new Error('Scheduling request failed or timed out');
            }
            const result = await response.json().catch(() => null);
            if (response.status === 200 && result?.ok === true && result.skipped === 'rest-window') {
              console.log('Automatic work paused for the rest window.'); process.exit(0);
            }
            // Resume persisted tag-restoration batches before planning starts.
            if (response.status === 202 && result?.sleepTags?.complete === false) continue;
            if (response.status === 202 && busyAttempts++ < 2) {
              await new Promise(resolve => setTimeout(resolve, 30_000));
              continue;
            }
            const stage = failureStages.has(result?.failure?.stage) ? result.failure.stage : 'unknown';
            // The API marks only read/archive failures as safe to replay. Do not
            // blindly retry gateway errors or ambiguous task/calendar writes.
            if (response.status === 502 && result?.failure?.retryable === true
                && retryStages.has(stage) && retryAttempts < 2) {
              const delay = 30_000 * ++retryAttempts;
              console.log(`Scheduling retry ${retryAttempts}/2: HTTP 502, stage=${stage}.`);
              await new Promise(resolve => setTimeout(resolve, delay));
              continue;
            }
            if (response.status !== 200 || result?.ok !== true || result.busy || result.error || !result.dailyPlan) {
              throw new Error(`Scheduling did not complete (HTTP ${response.status}, stage=${stage})`);
            }
            if (result.laundry?.outlook?.error) throw new Error('Laundry calendar sync did not complete; check Outlook connection.');
            if (result.charging?.outlook?.error) throw new Error('Charging calendar sync did not complete; check Outlook connection.');
            if (result.charging?.outlook?.enabled) {
              const { created = 0, updated = 0 } = result.charging.outlook;
              console.log(`Charging calendar sync completed: created=${created}, updated=${updated}.`);
            }
            if (result.periodPrediction) {
              const { created = 0, updated = 0, deleted = 0 } = result.periodPrediction;
              console.log(`Reminder sync completed: created=${created}, updated=${updated}, duplicates removed=${deleted}.`);
            }
            appendFileSync(process.env.GITHUB_OUTPUT, 'completed=true\n');
            console.log('Outlook and TickTick planning completed successfully.');
            process.exit(0);
          }
          throw new Error('Routine tag restoration still has pending batches');
          NODE
  daily-email:
    needs: [archive-periods, recalculate]
    if: ${{ always() && needs.archive-periods.result == 'success' && needs.recalculate.result == 'success' && needs.archive-periods.outputs.completed == 'true' && needs.recalculate.outputs.completed == 'true' && (github.event.schedule == '1 23 * * *' || inputs.send_email == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Send training and daily planning email
        env:
          CRON_SECRET: ${{ secrets.BONBILLS_CRON_SECRET }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const secret = process.env.CRON_SECRET?.trim();
          if (!secret) throw new Error('Missing BONBILLS_CRON_SECRET');
          for (let attempt = 0; attempt < 3; attempt++) {
            const response = await fetch('https://www.bonbills.cn/api/ticktick-trips?action=daily-email', {
              headers: { Authorization: `Bearer ${secret}` }, redirect: 'error', signal: AbortSignal.timeout(100_000),
            }).catch(() => { throw new Error('Email request failed; check delivery state before retrying'); });
            if (response.status === 202 && attempt < 2) {
              await response.body?.cancel();
              await new Promise(resolve => setTimeout(resolve, 30_000));
              continue;
            }
            const result = await response.json().catch(() => null);
            if (response.status === 200 && result?.ok === true && result.skipped === 'rest-window') {
              console.log('Automatic work paused for the rest window.'); process.exit(0);
            }
            if (response.status !== 200 || result?.sent !== true) {
              throw new Error(`Daily email did not complete (HTTP ${response.status})`);
            }
            console.log(result.duplicate ? 'Today’s email was already sent; duplicate skipped.' : 'Daily email accepted by SMTP server.');
            process.exit(0);
          }
          NODE
